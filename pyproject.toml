[project]
name = "pytrackinganalysis"
version = "0.1.0"
description = "Tracker-data analysis with a three-app PyQt6 UI (Hub / Config / QC)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.1",
    "mplcursors>=0.7.1",
    "natsort>=8.4.0",
    "numpy>=2.2.4",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pyperclip>=1.9.0",
    "pyqt6>=6.11.0",
    "pyqtdarktheme>=2.1.0",
    "pyyaml>=6.0.2",
    "qtawesome>=1.4.2",
    "reportlab>=4.0.0",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
]

[project.optional-dependencies]
# Only needed to run the notebooks under Notebooks/. These were hard runtime
# requirements, which meant every install — and every CI sync — pulled a whole
# Jupyter stack to run a headless analysis. `pip` and `pickleshare` in
# particular have no business being declared by a library at all.
notebook = [
    "ipykernel>=6.29.5",
    "ipympl>=0.10.0",
    "notebook>=7.4.4",
]

[project.scripts]
pytrack        = "pytrackinganalysis.apps.hub:main"
pytrack-hub    = "pytrackinganalysis.apps.hub:main"
pytrack-config = "pytrackinganalysis.apps.config_editor:main"
pytrack-qc     = "pytrackinganalysis.apps.qc_viewer:main"
pytrack-install-desktop = "pytrackinganalysis.install_desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytrackinganalysis"]

# Ensure in-app help markdown ships with the installed package.
[tool.hatch.build.targets.wheel.force-include]
"pytrackinganalysis/help/content" = "pytrackinganalysis/help/content"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# conftest.py lives in tests/ and the test modules import from it directly.
pythonpath = ["tests"]
# The headless Qt/matplotlib backends are set in tests/conftest.py, which runs
# before any test module imports them.
filterwarnings = ["error::FutureWarning"]
